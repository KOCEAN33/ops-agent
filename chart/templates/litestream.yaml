{{- if .Values.litestream.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ops-agent.fullname" . }}-litestream
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
data:
  # Litestream fills ${...} from its environment, so the credentials stay in
  # the Secret.
  litestream.yml: |
    addr: ":{{ .Values.litestream.metricsPort }}"
    dbs:
      - path: /data/ops-agent.sqlite
        replica:
          type: s3
          endpoint: ${R2_ENDPOINT}
          bucket: ${R2_BUCKET}
          path: {{ required "litestream.path is required" .Values.litestream.path }}
          region: auto
          access-key-id: ${R2_ACCESS_KEY_ID}
          secret-access-key: ${R2_SECRET_ACCESS_KEY}
{{- end }}
