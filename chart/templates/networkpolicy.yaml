{{- $am := .Values.alertmanager -}}
{{- $scraper := .Values.metrics.scraper -}}
{{- if not (or $am.namespaceSelector $am.podSelector) }}
{{- fail "alertmanager.namespaceSelector or alertmanager.podSelector is required: the webhook admits ingress from Alertmanager alone" }}
{{- end }}
# Ingress only. Cilium allows the union of every policy that selects a pod, so
# an egress rule here would widen the FQDN rules in the CiliumNetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ops-agent.fullname" . }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ops-agent.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- with $am.namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $am.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: http
    {{- if or $scraper.namespaceSelector $scraper.podSelector }}
    - from:
        - {{- with $scraper.namespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $scraper.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: metrics
        {{- if .Values.litestream.enabled }}
        # By number: Cilium resolves a named port only from the pod's
        # containers, and Litestream runs as a native sidecar.
        - port: {{ .Values.litestream.metricsPort }}
        {{- end }}
    {{- end }}
