{{- $scraper := .Values.metrics.scraper -}}
{{- if and .Values.litestream.enabled (or $scraper.namespaceSelector $scraper.podSelector) }}
# A lost volume restores the last copy that reached the bucket, so a
# replication that fails unseen would bring back an old month's spend.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ops-agent.fullname" . }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ops-agent-litestream
      rules:
        # A passing R2 error clears within minutes. One that holds for 15
        # minutes is a token, egress or bucket problem.
        - alert: OpsAgentLitestreamSyncFailing
          expr: rate(litestream_sync_error_count{namespace="{{ .Release.Namespace }}"}[5m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Litestream cannot sync the agent's SQLite file.
            description: The sidecar's logs name the error. Until it clears, a lost volume restores an older copy.
        - alert: OpsAgentLitestreamReplicaFailing
          expr: rate(litestream_replica_operation_errors_total{namespace="{{ .Release.Namespace }}"}[5m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Litestream cannot write the agent's SQLite file to R2.
            description: The sidecar's logs name the error. Until it clears, a lost volume restores an older copy.
{{- end }}
