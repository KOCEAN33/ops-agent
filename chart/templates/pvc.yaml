apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ops-agent.fullname" . }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
  annotations:
    # A deleted release keeps the sessions, the queue and the month's spend.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
