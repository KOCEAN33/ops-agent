{{- $fullname := include "ops-agent.fullname" . -}}
{{- $secret := required "secret.name is required" .Values.secret.name -}}
{{- $k := .Values.secret.keys -}}
{{- $g := .Values.github -}}
{{- $repos := $g.gitopsRepos -}}
{{- $discord := or .Values.discord.channelId .Values.discord.ownerId -}}
{{- /* Helm reads an unquoted number as a float, which loses a Discord ID's
digits and prints an App ID in exponent form. */ -}}
{{- range $name, $v := dict "discord.channelId" .Values.discord.channelId "discord.ownerId" .Values.discord.ownerId "github.appId" .Values.github.appId "github.installationId" .Values.github.installationId }}
{{- if and $v (not (kindIs "string" $v)) }}
{{- fail (printf "%s must be a quoted string" $name) }}
{{- end }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
spec:
  # The month's spend and the turn queue live in one SQLite file, so one
  # process runs, and the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ops-agent.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ops-agent.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $fullname }}
      securityContext:
        runAsNonRoot: true
        # git-sync's image user. The agent runs as the same user, so it reads
        # the clones.
        runAsUser: 65533
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops-agent
          image: {{ include "ops-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /data/ops-agent.sqlite
            - name: MODEL
              value: {{ required "model is required" .Values.model | quote }}
            - name: TURN_CAP_USD
              value: {{ required "turnCapUsd is required" .Values.turnCapUsd | quote }}
            - name: MONTHLY_CAP_USD
              value: {{ required "monthlyCapUsd is required" .Values.monthlyCapUsd | quote }}
            {{- with .Values.price }}
            - name: PRICE_INPUT
              value: {{ required "price.input is required with any price" .input | quote }}
            - name: PRICE_OUTPUT
              value: {{ required "price.output is required with any price" .output | quote }}
            - name: PRICE_CACHE_READ
              value: {{ required "price.cacheRead is required with any price" .cacheRead | quote }}
            - name: PRICE_CACHE_WRITE
              value: {{ required "price.cacheWrite is required with any price" .cacheWrite | quote }}
            {{- end }}
            {{- with .Values.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.lokiUrl }}
            - name: LOKI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.linkAllowlist }}
            - name: LINK_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            {{- include "ops-agent.secretEnv" (dict "env" "ANTHROPIC_API_KEY" "secret" $secret "key" $k.anthropicApiKey) | nindent 12 }}
            {{- include "ops-agent.secretEnv" (dict "env" "WEBHOOK_TOKEN" "secret" $secret "key" $k.webhookToken) | nindent 12 }}
            {{- if $discord }}
            - name: DISCORD_CHANNEL_ID
              value: {{ required "discord.channelId is required with discord.ownerId" .Values.discord.channelId | quote }}
            - name: DISCORD_OWNER_ID
              value: {{ required "discord.ownerId is required with discord.channelId" .Values.discord.ownerId | quote }}
            {{- include "ops-agent.secretEnv" (dict "env" "DISCORD_BOT_TOKEN" "secret" $secret "key" $k.discordBotToken) | nindent 12 }}
            {{- end }}
            {{- if $repos }}
            - name: GITOPS_DIR
              value: /repos/gitops
            - name: GITOPS_REPOS
              value: {{ join "," $repos | quote }}
            {{- end }}
            {{- if $g.instructionsRepo }}
            - name: INSTRUCTIONS_DIR
              value: /repos/instructions/current
            {{- end }}
            {{- if and $g.appId $repos }}
            - name: GITHUB_APP_ID
              value: {{ $g.appId | quote }}
            {{- include "ops-agent.secretEnv" (dict "env" "GITHUB_APP_KEY" "secret" $secret "key" $k.githubAppKey) | nindent 12 }}
            {{- end }}
          # The server answers 404 off its one route, so the probes check the
          # port.
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            {{- include "ops-agent.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
              subPath: ops-agent
            # Each whole git-sync root, since its link is relative. The agent
            # reads owner/name's clone at /repos/gitops/<name>/current.
            {{- range $i, $r := $repos }}
            - name: gitops-{{ $i }}
              mountPath: /repos/gitops/{{ last (splitList "/" $r) }}
              readOnly: true
            {{- end }}
            {{- if $g.instructionsRepo }}
            - name: instructions
              mountPath: /repos/instructions
              readOnly: true
            {{- end }}
        {{- /* Named by index: a volume name is a DNS label, and a repository
        name may not be one. */ -}}
        {{- range $i, $r := $repos }}
        {{- include "ops-agent.gitSync" (dict "root" $ "name" (printf "gitops-%d" $i) "repo" $r) | nindent 8 }}
        {{- end }}
        {{- with $g.instructionsRepo }}
        {{- include "ops-agent.gitSync" (dict "root" $ "name" "instructions" "repo" .) | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}
        - name: tmp
          emptyDir: {}
        {{- range $i, $r := $repos }}
        - name: gitops-{{ $i }}
          emptyDir: {}
        {{- end }}
        {{- if $g.instructionsRepo }}
        - name: instructions
          emptyDir: {}
        {{- end }}
        {{- if or $repos $g.instructionsRepo }}
        - name: github-app
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
            items:
              - key: {{ $k.githubAppKey }}
                path: key.pem
        {{- end }}
