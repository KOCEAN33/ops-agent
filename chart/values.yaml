# Every value without a default is required, and `helm template` stops on a
# missing one.

image:
  # Such as the registry's pull-through cache path for the GHCR image.
  repository: ""
  # A tag or a digest (sha256:...). Pin one, so a new image reaches the
  # cluster only through a commit to the GitOps repository.
  tag: ""
  pullPolicy: IfNotPresent

# Anthropic model ID. src/config.ts holds its price, or set price below.
model: claude-sonnet-5-5
# USD per million tokens, all four or none. Overrides the built-in table.
price: {}
#   input: 2
#   output: 10
#   cacheRead: 0.1
#   cacheWrite: 2.5

turnCapUsd: ""
monthlyCapUsd: ""

# A Secret in the release namespace, such as one the cluster's secret store
# syncs. The chart reads it and never creates it.
secret:
  name: ""
  keys:
    anthropicApiKey: ANTHROPIC_API_KEY
    webhookToken: WEBHOOK_TOKEN
    # Read only when discord is set.
    discordBotToken: DISCORD_BOT_TOKEN
    # The GitHub App's private key, PEM. Read only when github is set.
    githubAppKey: GITHUB_APP_KEY
    # The R2 bucket's endpoint URL, its name and a token scoped to it. Read
    # only by the Litestream containers, never by the agent.
    r2Endpoint: R2_ENDPOINT
    r2Bucket: R2_BUCKET
    r2AccessKeyId: R2_ACCESS_KEY_ID
    r2SecretAccessKey: R2_SECRET_ACCESS_KEY

# In-cluster read sources. Each left empty turns its tools off.
prometheusUrl: ""
lokiUrl: ""

# Hosts whose links survive in Discord posts and issues.
linkAllowlist: []

# Both set turn the Discord bot on. Quote every ID: Helm reads a bare number as
# a float, so the chart refuses one.
discord:
  channelId: ""
  ownerId: ""

# The GitHub App, IDs quoted. appId and gitopsRepos turn issues on. Each
# repository listed also gets a git-sync sidecar that keeps a clone current with
# the App's contents read: the GitOps clones feed the read tools, the
# instructions clone the operating instructions.
github:
  appId: ""
  # git-sync needs it to mint its own token. One installation covers every
  # repository below.
  installationId: ""
  # GitOps repositories as owner/name, the first being the default issue
  # repository. The model sees each by its name, so names must be unique.
  gitopsRepos: []
  # owner/name
  instructionsRepo: ""

gitSync:
  image: registry.k8s.io/git-sync/git-sync:v4.8.0
  period: 60s

# Litestream replicates the SQLite file to an R2 bucket within seconds of each
# write, and restores the newest copy before the agent starts on an empty
# volume. Egress must admit the endpoint's host, such as in ciliumEgress.fqdns.
litestream:
  enabled: false
  image: docker.io/litestream/litestream:0.5.17-scratch
  # The prefix under which the bucket holds the replica, without a leading /.
  path: ops-agent
  # Litestream's own metrics. With metrics.scraper set, the PodMonitor scrapes
  # them and a PrometheusRule warns while replication keeps failing, since the
  # sidecar only logs its errors and the pod stays Ready.
  metricsPort: 9091
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

persistence:
  # Holds the SQLite file: sessions, the turn queue, spend and the outboxes.
  size: 1Gi
  storageClass: ""

service:
  port: 8080

# Ingress to the webhook is admitted from these pods alone. The webhook token
# still holds without the policy.
alertmanager:
  namespaceSelector: {}
  podSelector: {}

# /metrics on its own port, apart from the webhook. A scraper selector admits
# those pods to it and makes a PodMonitor, which needs the Prometheus
# Operator's CRDs. Without one, nothing reaches the port.
metrics:
  port: 9464
  scraper:
    namespaceSelector: {}
    podSelector: {}
  podMonitor:
    # Such as the label the Prometheus resource's podMonitorSelector matches.
    labels: {}
    interval: 30s
  # A ConfigMap holding a Grafana dashboard of the metrics, for a Grafana
  # sidecar that loads ConfigMaps by label. Enable it on one release: the
  # dashboard's uid is fixed, and its job variable lists every release.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    # Such as the sidecar's folder annotation.
    annotations: {}

# Egress through the CNI's FQDN rules. Off, egress is not limited.
ciliumEgress:
  enabled: false
  # HTTPS hosts: the model API, Discord and GitHub. Discord's gateway resumes on
  # regional hosts under discord.gg.
  fqdns:
    - matchName: api.anthropic.com
    - matchName: discord.com
    - matchPattern: "*.discord.gg"
    - matchName: api.github.com
    - matchName: github.com
  # In-cluster endpoints: the PromQL endpoint and Loki. Each entry is a
  # namespace, pod labels and ports.
  inCluster: []
  #  - namespace: monitoring
  #    podLabels: { app.kubernetes.io/name: example }
  #    ports: [9090]
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi

gitSyncResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
